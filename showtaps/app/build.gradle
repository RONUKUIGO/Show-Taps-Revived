plugins {
    id 'com.android.application'
}

// 本沙箱是 aarch64 宿主，官方 NDK 只提供 x86_64 主机工具链。
// 因此允许用 -PusePrebuiltNative 跳过 CMake，直接打包 app/src/main/jniLibs 下的预编译 .so
// （正常 x86_64 开发机上不加这个参数，仍由 CMake+NDK 现场编译）
def usePrebuiltNative = project.hasProperty('usePrebuiltNative')

android {
    namespace 'show.taps'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId "show.taps"
        minSdk 29
        targetSdk 36
        versionCode 9
        versionName "5.1-a16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }
        if (!usePrebuiltNative) {
            externalNativeBuild {
                cmake {
                    cppFlags "-fvisibility=hidden -fvisibility-inlines-hidden -Wl,-Bsymbolic -Wl,--exclude-libs,ALL -s"
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                    // Android 15+ 的 16KB page size 设备要求；NDK r28 起支持
                    arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                }
            }
        }
    }

    // ---- 发布签名 ----
    // 项目规范见 docs/KEYSTORE.md：一把钥匙（KeySigned_By_Rinkyu）供所有项目使用，
    // 工程里不放密钥，只读环境变量；用 `wskeys run -- gradle ...` 注入：
    //   B50_KEYSTORE / B50_STORE_PASS / B50_ALIAS / B50_KEY_PASS
    def envKeystore  = System.getenv("B50_KEYSTORE")
    def envStorePass = System.getenv("B50_STORE_PASS")
    def envKeyAlias  = System.getenv("B50_ALIAS")
    def envKeyPass   = System.getenv("B50_KEY_PASS")
    def hasEnvKey = envKeystore != null && envStorePass != null && envKeyPass != null

    signingConfigs {
        if (hasEnvKey) {
            releaseKey {
                storeFile file(envKeystore)
                storePassword envStorePass
                keyAlias envKeyAlias ?: "KeySigned_By_Rinkyu"
                keyPassword envKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            if (hasEnvKey) {
                signingConfig signingConfigs.releaseKey
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    viewBinding {
        enable true
    }
    buildFeatures {
        aidl true
        buildConfig true
    }

    if (!usePrebuiltNative) {
        externalNativeBuild {
            cmake {
                // 版本由 local.properties 的 cmake.dir 指定（本机 aarch64 宿主用系统 cmake）
                path file('src/main/cpp/CMakeLists.txt')
            }
        }
    }

    packaging {
        jniLibs {
            // 需要把 .so 解包到 nativeLibraryDir：root 通道用绝对路径 System.load()
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    implementation 'com.github.skydoves:colorpickerview:2.3.0'
}
